<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="../css/estilo.css">
    <script src="../js/script.js"></script>
    <script src="../js/calculadora.js"></script>
</head>
<body>
     <header class="header1">
        <H1 style="color: white; text-align: center;">
            PRACTICAS 
        </H1>
        <div class="dropdown">
          <button onclick="abrirMenu()" class="dropbtn">Páginas ▼</button>
          <div id="miMenu" class="dropdown-content">
            <a href="index.html">Inicio</a>
            <a href="calculadora.html">Calculadora</a>
            <a href="juego.html">Juego</a>
            <a href="estilosjava.html">Estilos</a>
          </div>
        </div>
    </header>
    <table>
        <thead>
            <input type="text" id="pantalla" value="0" readonly>
        </thead>
        <tbody>
            <tr>
                <td><button onclick="escribir('1')">1</button></td>
                <td><button onclick="escribir('2')">2</button></td>
                <td><button onclick="escribir('3')">3</button></td>
                <td><button onclick="escribir('+')">+</button></td>
            </tr>
            <tr>
                <td><button onclick="escribir('4')">4</button></td>
                <td><button onclick="escribir('5')">5</button></td>
                <td><button onclick="escribir('6')">6</button></td>
                <td><button onclick="escribir('-')">-</button></td>
            </tr>
            <tr>
                <td><button onclick="escribir('7')">7</button></td>
                <td><button onclick="escribir('8')">8</button></td>
                <td><button onclick="escribir('9')">9</button></td>
                <td><button onclick="escribir('*')">*</button></td>
            </tr>
            <tr>
                <td><button onclick="escribir('0')">0</button></td>
                <td><button onclick="calcular()">=</button></td>
                <td><button onclick="escribir('.')">.</button></td>
                <td><button onclick="escribir('/')">/</button></td>
            </tr>
            <tr>
                <td colspan="4"><button id="borrar" onclick="borrar()">Borrar</button></td>
            </tr>
    </table>
</body>
</html>
